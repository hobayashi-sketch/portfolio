name: prune-expired-passwords
on:
  schedule:
    - cron: "5 15 * * *" # 毎日 0:05（日本時間）
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/prune.mjs
      - name: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -am "期限切れパスワードを削除"
            git push
            curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/pages/builds || true
          fi
