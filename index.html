<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hidefumi Obayashi</title>
<style>
:root{--bg:#0b0b0b;--card:#141414;--line:#2a2a2a;--text:#f2f2f2;--sub:#9a9a9a;--accent:#E8FF47}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Helvetica Neue",sans-serif;min-height:100svh;display:grid;place-items:center;padding:16px}
.card{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 28px}
h1{font:700 20px "Helvetica Neue",sans-serif;letter-spacing:.02em}
h1 i{color:var(--accent);font-style:normal}
p{color:var(--sub);font-size:13px;margin:10px 0 24px;line-height:1.7}
input{width:100%;background:#0b0b0b;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:14px;font-size:16px;outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:12px;background:var(--accent);color:#0b0b0b;border:0;border-radius:10px;padding:14px;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:#ff8a8a;font-size:13px;margin-top:14px;min-height:1.2em}
</style>
</head>
<body>
<form class="card" id="f">
  <h1>Hidefumi Obayashi<i>.</i></h1>
  <p>パスワードを入力してください<br>Please enter the password.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
  <button id="b" type="submit">開く / Open</button>
  <div class="err" id="err"></div>
</form>
<script>
const te=new TextEncoder(),td=new TextDecoder();
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const endOf=d=>Date.parse(d+"T23:59:59+09:00");
async function tryOpen(pw){
  const S=await (await fetch("slots.json?"+Date.now(),{cache:"no-store"})).json();
  const base=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub64(S.salt),iterations:S.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  let found=null;
  for(const s of S.slots){
    try{found=JSON.parse(td.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(s.iv)},key,ub64(s.ct))));break;}catch(e){}
  }
  if(!found) return "wrong";
  if(Date.now()>endOf(found.exp)) return "expired";
  const C=await (await fetch("content.json?"+Date.now(),{cache:"no-store"})).json();
  const K=await crypto.subtle.importKey("raw",ub64(found.k),"AES-GCM",false,["decrypt"]);
  const html=td.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(C.iv)},K,ub64(C.ct)));
  try{sessionStorage.setItem("pf_pw",pw)}catch(e){}
  document.open();document.write(html);document.close();
  return "ok";
}
const f=document.getElementById("f"),b=document.getElementById("b"),err=document.getElementById("err");
async function go(pw){
  b.disabled=true;err.textContent="";
  try{
    const r=await tryOpen(pw);
    if(r==="wrong") err.textContent="パスワードが違うか、期限が切れています / Wrong or expired password";
    if(r==="expired") err.textContent="このパスワードは期限切れです / This password has expired";
  }catch(e){err.textContent="読み込みに失敗しました。再読み込みしてください / Failed to load"}
  b.disabled=false;
}
f.addEventListener("submit",e=>{e.preventDefault();const v=document.getElementById("pw").value.trim();if(v)go(v)});
let saved=null;try{saved=sessionStorage.getItem("pf_pw")}catch(e){}
if(saved)go(saved);
</script>
</body>
</html>
